<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; media-src 'self'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'unsafe-inline'; connect-src https://euguiuqdjtpwdztifrlc.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex,nofollow">
<title>Check in — The Lagom Clinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --lav:#363662; --ocre:#C9762A; --ti:#E6E4E3; --muted:#68677E; --line:#DEDCE0;
          --green:#2E7D4F; --greenbg:#E4F3EA; --amber:#B4790C; --amberbg:#FBEEDA; --red:#B23A3A; --redbg:#FAE6E6; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { min-height:100%; margin:0; }
  body { padding:2.5vh 0 40vh; }
  body { background:#363658; color:var(--lav); font-family:'Raleway',-apple-system,system-ui,sans-serif;
         display:flex; align-items:flex-start; justify-content:center; user-select:none; -webkit-user-select:none;
         overscroll-behavior:none; }
  .card { position:relative; z-index:2; background:#fff; width:min(760px,92vw); border-radius:10px 10px 10px 10px; border-top:6px solid var(--ocre);
          box-shadow:0 6px 28px rgba(54,54,98,.14); padding:26px 52px 30px; text-align:center; transition:padding .15s; }
  img.logo { height:72px; margin-bottom:0; }
  h1 { font-family:'Nanum Myeongjo',Georgia,serif; font-weight:700; font-size:36px; margin:6px 0 4px; }
  p.sub { color:var(--muted); font-size:20px; margin:0 0 20px; line-height:1.4; }
  /* while typing, free up vertical space for the on-screen keyboard */
  body.typing img.logo { height:40px; }
  @media (max-height:760px) { body.typing img.logo { display:none; } body.typing .card { padding-top:20px; } input { padding:12px 16px; } .row { margin-bottom:14px; } }
  body.typing #form h1, body.typing #form p.sub { display:none; }
  body.typing .card { padding-top:14px; }
  label { display:block; text-align:left; font-size:14px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
          color:var(--ocre); margin:0 0 8px 2px; }
  input { font:inherit; color:var(--lav); border:2px solid var(--line); border-radius:10px; background:#FAF9F8;
          padding:16px 18px; font-size:28px; width:100%; outline:none; user-select:text; -webkit-user-select:text; }
  input:focus { border-color:var(--lav); background:#fff; }
  .row { margin-bottom:18px; }
  .dob { display:grid; grid-template-columns:1fr 1fr 1.6fr; gap:14px; }
  .dob input { text-align:center; }
  button { font:inherit; font-weight:700; font-size:26px; letter-spacing:.02em; width:100%; border:0; border-radius:10px;
           background:var(--lav); color:#fff; padding:18px; cursor:pointer; margin-top:2px; }
  button:active { background:var(--ocre); }
  button:disabled { opacity:.55; }
  .err { color:var(--red); background:var(--redbg); border-left:4px solid var(--red); text-align:left; font-size:19px;
         padding:12px 16px; border-radius:6px; margin:0 0 18px; display:none; }
  .result { display:none; }
  .badge { width:104px; height:104px; border-radius:50%; margin:6px auto 18px; display:flex; align-items:center;
           justify-content:center; font-size:60px; font-weight:700; }
  .b-ok { background:var(--greenbg); color:var(--green); } .b-warn { background:var(--amberbg); color:var(--amber); }
  .b-bad { background:var(--redbg); color:var(--red); }
  .small { color:var(--muted); font-size:17px; margin-top:22px; }
  .test { background:var(--amberbg); color:var(--amber); font-weight:700; padding:8px 14px; border-radius:6px; display:inline-block; margin-bottom:14px; }
  .busy { opacity:.6; pointer-events:none; }

  /* ---- animated backdrop shared by every screen ---- */
  #backdrop { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; background:#363658; }
  body.at-home #app { visibility:hidden; }
  /* ---- attract / home screen ---- */
  #home { position:fixed; inset:0; z-index:50; display:none; flex-direction:column; align-items:center; justify-content:center;
          background:transparent; color:#fff; text-align:center; overflow:hidden; cursor:pointer; }
  #home.on { display:flex; }
  #backdrop .bg { position:absolute; inset:-20%; background:
      radial-gradient(28% 30% at 6% 10%, rgba(201,118,42,.26), transparent 70%),
      radial-gradient(30% 32% at 96% 92%, rgba(120,120,190,.32), transparent 70%),
      radial-gradient(22% 24% at 94% 8%, rgba(201,118,42,.14), transparent 70%);
      animation:drift 26s ease-in-out infinite alternate; }
  #backdrop .bg2 { position:absolute; inset:-20%; background:
      radial-gradient(26% 28% at 4% 94%, rgba(120,120,190,.26), transparent 70%),
      radial-gradient(24% 26% at 98% 40%, rgba(201,118,42,.12), transparent 70%);
      animation:drift 34s ease-in-out infinite alternate-reverse; }
  @keyframes drift { 0% { transform:translate3d(-4%,-3%,0) scale(1); } 50% { transform:translate3d(5%,4%,0) scale(1.12); } 100% { transform:translate3d(-2%,6%,0) scale(1.04); } }
  #backdrop .rings { position:absolute; left:50%; top:50%; width:0; height:0; }
  #backdrop .rings i { position:absolute; border:2px solid rgba(255,255,255,.2); border-radius:50%; left:0; top:0; transform:translate(-50%,-50%) scale(.3);
                   width:90vmin; height:90vmin; opacity:0; animation:ring 12s ease-out infinite; }
  #backdrop .rings i:nth-child(2) { animation-delay:4s; } #backdrop .rings i:nth-child(3) { animation-delay:8s; }
  @keyframes ring { 0% { transform:translate(-50%,-50%) scale(.3); opacity:0; } 15% { opacity:.9; } 100% { transform:translate(-50%,-50%) scale(1.25); opacity:0; } }
  #home .content { position:relative; z-index:2; animation:rise 1.4s ease-out both; }
  @keyframes rise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
  #home .mark { width:min(380px,44vmin); aspect-ratio:1; margin:0 auto; position:relative; }
  #home .mark video { width:100%; height:100%; display:block; background:#363658; transition:opacity .9s ease;
      -webkit-mask-image:radial-gradient(circle, #000 58%, transparent 71%); mask-image:radial-gradient(circle, #000 58%, transparent 71%); }
  #home .mark::after { content:''; position:absolute; inset:-10%; border-radius:50%; background:radial-gradient(circle, rgba(201,118,42,.13) 0, rgba(201,118,42,.13) 38%, rgba(201,118,42,0) 68%); animation:glow 6s ease-in-out infinite; pointer-events:none; }
  @keyframes glow { 0%,100% { opacity:.35; } 50% { opacity:1; } }
  #home .name { font-family:'Nanum Myeongjo',Georgia,serif; font-weight:700; color:var(--ocre); letter-spacing:.32em; text-transform:uppercase; font-size:clamp(15px,1.9vw,21px); margin:6px 0 0 .32em; }
  #home h2 { font-family:'Nanum Myeongjo',Georgia,serif; font-weight:400; font-size:clamp(28px,4.4vw,46px); margin:22px 0 8px; letter-spacing:.01em; }
  #home p { color:rgba(255,255,255,.72); font-size:clamp(17px,2.2vw,23px); margin:0 0 38px; }
  #home .tap { display:inline-block; background:var(--ocre); color:#fff; font-weight:700; font-size:clamp(22px,2.8vw,30px); letter-spacing:.04em;
               padding:20px 64px; border-radius:60px; animation:pulse 2.8s ease-in-out infinite; box-shadow:0 0 0 0 rgba(201,118,42,.55); }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(201,118,42,.55); } 70% { box-shadow:0 0 0 30px rgba(201,118,42,0); } 100% { box-shadow:0 0 0 0 rgba(201,118,42,0); } }
  @media (prefers-reduced-motion: reduce) { #home * { animation:none !important; } }

</style>
</head>
<body>
<div id="backdrop"><div class="bg"></div><div class="bg2"></div><div class="rings"><i></i><i></i><i></i></div></div>

<div id="home" role="button" aria-label="Tap to check in">
  <div class="content">
    <div class="mark"><video id="hv" muted playsinline webkit-playsinline preload="auto" autoplay aria-hidden="true"><source src="icon.mp4" type="video/mp4"></video></div>
    <div class="name">The Lagom Clinic</div>
    <h2>Welcome</h2>
    <p>Please check in for your appointment</p>
    <span class="tap">Tap to check in</span>
  </div>
</div>

      <label>Date of birth</label>
      <div class="dob">
        <input id="dd" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="DD" autocomplete="off">
        <input id="mm" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="MM" autocomplete="off">
        <input id="yyyy" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="YYYY" autocomplete="off">
      </div>
    </div>
    <button id="go" type="button">Check in</button>
  </section>

  <section class="result" id="setup">
    <h1>Set up this device</h1>
    <p class="sub">Enter the setup code (clinic staff only).</p>
    <div class="row"><input id="setupcode" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="Setup code"></div>
    <button id="setupgo" type="button">Save</button>
  </section>

  <section class="result" id="result">
    <div class="badge" id="badge"></div>
    <div id="testflag"></div>
    <h1 id="rtitle"></h1>
    <p class="sub" id="rtext" style="margin-bottom:0"></p>
    <p class="small" id="rsmall"></p>
  </section>
</main>

<script>
(function () {
  var API = 'https://euguiuqdjtpwdztifrlc.supabase.co/functions/v1/checkin';
  var KEY_STORE = 'lagom_checkin_key';
  var h = (location.hash + '&' + location.search).match(/[#?&]k=([^&]+)/);
  if (h) { try { localStorage.setItem(KEY_STORE, decodeURIComponent(h[1])); } catch (e) {} }

  var $ = function (id) { return document.getElementById(id); };
  var form = $('form'), result = $('result'), err = $('err'), go = $('go');
  var idle, resetTimer;
  var home = $('home'), hv = $('hv'), loopT;
  function playIntro() {
    clearTimeout(loopT);
    if (!hv) return;
    hv.style.opacity = 1;
    try { hv.currentTime = 0; var pr = hv.play(); if (pr && pr.catch) pr.catch(function () {}); } catch (e) {}
  }
  // Loop: hold the finished mark for a few seconds, fade out, replay from the start.
  if (hv) hv.addEventListener('ended', function () {
    if (!home.classList.contains('on')) return;
    loopT = setTimeout(function () { hv.style.opacity = 0; loopT = setTimeout(playIntro, 950); }, 3500);
  });
  function showHome() {
    clearTimeout(resetTimer); clearTimeout(idle);
    $('surname').value = ''; $('dd').value = ''; $('mm').value = ''; $('yyyy').value = '';
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    document.body.classList.remove('typing');
    err.style.display = 'none'; result.style.display = 'none'; $('setup').style.display = 'none'; form.style.display = 'block';
    form.classList.remove('busy'); go.disabled = false; go.textContent = 'Check in';
    home.classList.add('on'); document.body.classList.add('at-home');
    playIntro();
  }
  home.addEventListener('click', function () { clearTimeout(loopT); home.classList.remove('on'); document.body.classList.remove('at-home'); showForm(); });

  function showForm() {
    clearTimeout(resetTimer);
    $('surname').value = ''; $('dd').value = ''; $('mm').value = ''; $('yyyy').value = '';
    err.style.display = 'none'; result.style.display = 'none'; $('setup').style.display = 'none'; form.style.display = 'block';
    form.classList.remove('busy'); go.disabled = false; go.textContent = 'Check in';
    touch();
  }
  function touch() { clearTimeout(idle); idle = setTimeout(function () { if (form.style.display !== 'none' && !home.classList.contains('on') && !go.disabled) showHome(); }, 10000); }
  ['touchstart', 'keydown', 'mousedown'].forEach(function (ev) { document.addEventListener(ev, touch, { passive: true }); });

  function show(kind, title, text, small, secs, test) {
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    document.body.classList.remove('typing');
    form.style.display = 'none'; result.style.display = 'block';
    var b = $('badge');
    b.className = 'badge ' + (kind === 'ok' ? 'b-ok' : kind === 'warn' ? 'b-warn' : 'b-bad');
    b.textContent = kind === 'ok' ? '\u2713' : kind === 'warn' ? '!' : '\u00d7';
    var tf = $('testflag'); tf.textContent = '';
    if (test) { var sp = document.createElement('span'); sp.className = 'test'; sp.textContent = 'TEST MODE \u2014 nothing was recorded'; tf.appendChild(sp); }
    $('rtitle').textContent = title; $('rtext').textContent = text; $('rsmall').textContent = small || '';
    clearTimeout(resetTimer); resetTimer = setTimeout(showHome, secs * 1000);
  }
  function fail(msg) { err.textContent = msg; err.style.display = 'block'; form.classList.remove('busy'); go.disabled = false; go.textContent = 'Check in'; }

  ['dd', 'mm'].forEach(function (id) {
    $(id).addEventListener('input', function (e) {
      e.target.value = e.target.value.replace(/\D/g, '');
      if (e.target.value.length === 2) $(id === 'dd' ? 'mm' : 'yyyy').focus();
    });
  });
  $('yyyy').addEventListener('input', function (e) { e.target.value = e.target.value.replace(/\D/g, ''); });
  $('surname').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('dd').focus(); });
  $('yyyy').addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });

  var NEEDHELP = 'Please call the clinic on the number in your appointment confirmation.';

  function submit() {
    var s = $('surname').value.trim(), d = $('dd').value, m = $('mm').value, y = $('yyyy').value;
    if (s.length < 2) return fail('Please enter your surname.');
    if (!d || !m || y.length !== 4) return fail('Please enter your full date of birth.');
    var dob = y + '-' + ('0' + m).slice(-2) + '-' + ('0' + d).slice(-2);
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    err.style.display = 'none'; form.classList.add('busy'); go.disabled = true; go.textContent = 'Checking\u2026';
    var key = ''; try { key = localStorage.getItem(KEY_STORE) || ''; } catch (e) {}
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-kiosk-key': key },
      body: JSON.stringify({ surname: s, dob: dob }) })
      .then(function (r) { return r.json().then(function (j) { j._http = r.status; return j; }); })
      .then(function (j) {
        var n = j.firstName ? ', ' + j.firstName : '';
        if (j.status === 'ok') show('ok', 'Thank you' + n, "You're checked in. Please take a seat \u2014 your clinician will be with you shortly.", '', 10);
        else if (j.status === 'dry_run') show('ok', 'Thank you' + n, "Check-in would have been recorded for your " + j.time + " appointment.", '', 10, true);
        else if (j.status === 'already') show('ok', 'Already checked in' + n, 'Please take a seat \u2014 your clinician will be with you shortly.', '', 10);
        else if (j.status === 'too_early') show('warn', 'Hello' + n, 'Your appointment is at ' + j.time + '. Check-in opens at ' + j.opensAt + ' \u2014 please come back then.', '', 12);
        else if (j.status === 'not_found') fail("We couldn't find an appointment today with those details. Please check the spelling and date of birth, and try again.");
        else if (j.status === 'bad_request') fail('Please check your surname and date of birth.');
        else if (j.status === 'locked') show('bad', 'Check-in unavailable', NEEDHELP, '', 20);
        else if (j.status === 'unauthorised') { try { localStorage.removeItem(KEY_STORE); } catch (e) {} form.style.display = 'none'; result.style.display = 'none'; $('setup').style.display = 'block'; home.classList.remove('on'); document.body.classList.remove('at-home'); }
        else show('warn', "We couldn't check you in automatically", NEEDHELP, '', 20);
      })
      .catch(function () { show('warn', "We couldn't check you in automatically", NEEDHELP, '', 20); });
  }
  document.addEventListener('focusin', function (e) { if (e.target.tagName === 'INPUT') document.body.classList.add('typing'); });
  document.addEventListener('focusout', function () { setTimeout(function () { if (!document.activeElement || document.activeElement.tagName !== 'INPUT') document.body.classList.remove('typing'); }, 150); });
  go.addEventListener('click', submit);
  $('setupgo').addEventListener('click', function () {
    var c = $('setupcode').value.trim();
    if (c.length < 8) return;
    try { localStorage.setItem(KEY_STORE, c); } catch (e) {}
    $('setupcode').value = ''; showHome();
  });
  var have = ''; try { have = localStorage.getItem(KEY_STORE) || ''; } catch (e) {}
  showHome();
  if (!have) { home.classList.remove('on'); form.style.display = 'none'; $('setup').style.display = 'block'; home.classList.remove('on'); document.body.classList.remove('at-home'); }
})();
</script>
</body>
</html>
